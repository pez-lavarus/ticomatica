<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 458 374"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Circle D on the coordinate plane</title>
  <desc id="desc">A circle centered at (4, 0), with its highest point at y equals 3 and lowest point at y equals negative 3.</desc>

  <style>
    .line {
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .axis { stroke-width: 2.7; }
    .guide {
      stroke: currentColor;
      stroke-width: 2;
      stroke-dasharray: 9 7;
      opacity: .55;
      fill: none;
    }
    .label {
      fill: currentColor;
      stroke: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 27px;
    }
    .point { fill: currentColor; }
  </style>

  <!-- Dashed coordinate guides -->
  <path class="guide" d="M144.5 129 H260.5 M144.5 287 H260.5"/>
  <path class="guide" d="M260.5 129 V287"/>

  <!-- Coordinate axes and arrowheads -->
  <path class="line axis" d="M39 209 H386"/>
  <path class="line axis" d="M144.5 359 V42"/>
  <path fill="currentColor" d="M389 209 L373 201 L373 217 Z"/>
  <path fill="currentColor" d="M144.5 39 L136.5 55 L152.5 55 Z"/>

  <!-- Circle -->
  <circle class="line" cx="259.5" cy="208.5" r="78"/>

  <!-- Center and extreme points -->
  <circle class="point" cx="259.5" cy="208.5" r="6.5"/>
  <circle class="point" cx="261.5" cy="129" r="6.5"/>
  <circle class="point" cx="261.5" cy="286.5" r="6.5"/>

  <!-- Labels -->
  <g class="label">
    <text x="138" y="29">y</text>
    <text x="395" y="217">x</text>
    <text x="118" y="140">3</text>
    <text x="101" y="297">−3</text>
    <text x="265" y="199">O</text>
    <text x="265" y="242">4</text>
    <text x="308" y="139">d</text>
  </g>
</svg>
