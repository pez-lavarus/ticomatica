<g class="dot"><circle cx="123" cy="89" r="4"/><circle cx="123" cy="136" r="4"/><circle cx="123" cy="183" r="4"/><circle cx="76" cy="136" r="4"/><circle cx="170" cy="136" r="4"/></g>
<g class="label"><text x="120" y="30">y</text><text x="237" y="142">x</text><text x="109" y="84">2</text><text x="91" y="202">− 2</text><text x="46" y="131">− 2</text><text x="173" y="132">2</text><text x="126" y="132">O</text></g>
</svg>
