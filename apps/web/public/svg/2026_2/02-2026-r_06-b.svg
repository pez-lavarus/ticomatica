<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 279 257" role="img" aria-labelledby="title desc">
<title id="title">Circle centered at the origin with radius 2</title>
<desc id="desc">Coordinate axes with a circle passing through x equals plus or minus 2 and y equals plus or minus 2.</desc>
<style>
.line { fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.axis {stroke-width:2;}
.dot {fill:currentColor;}
.label {font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:currentColor;}
</style>
