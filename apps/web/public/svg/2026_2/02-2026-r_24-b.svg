<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 237 222" role="img" aria-labelledby="title desc">
<title id="title">Coordinate axes and two rays</title>
<desc id="desc">Two rays start from a point on the positive y-axis, one pointing up and right, the other down and right.</desc>
