<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Cartesian plane from -10 to 10 with plotted circle">
  <rect width="100%" height="100%" fill="white"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="black"/>
    </marker>

    <style>
      .grid {
        stroke: black;
        stroke-width: 1;
        opacity: 0.15;
      }
      .axis {
        stroke: black;
        stroke-width: 2.5;
      }
      .tick {
        stroke: black;
        stroke-width: 1.5;
      }
      .label {
        fill: black;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
      }
      .label-x {
        text-anchor: middle;
      }
      .label-y {
        text-anchor: end;
        dominant-baseline: middle;
      }
      .axis-label {
        fill: black;
        font-family: "Times New Roman", Times, serif;
        font-size: 18px;
        font-style: italic;
        font-weight: bold;
      }
      .plot-geometry {
        stroke: black;
        stroke-width: 2.5;
        fill: none;
      }
      .plot-dot {
        fill: black;
      }
      .plot-text {
        fill: black;
        font-family: "Times New Roman", Times, serif;
        font-size: 18px;
        font-style: italic;
      }
    </style>
  </defs>

  <g transform="translate(400,400)">

    <path class="grid" d="
      M -350 -350 v 700 M -315 -350 v 700 M -280 -350 v 700 M -245 -350 v 700 M -210 -350 v 700
      M -175 -350 v 700 M -140 -350 v 700 M -105 -350 v 700 M -70 -350 v 700 M -35 -350 v 700
      M 0 -350 v 700 M 35 -350 v 700 M 70 -350 v 700 M 105 -350 v 700 M 140 -350 v 700
      M 175 -350 v 700 M 210 -350 v 700 M 245 -350 v 700 M 280 -350 v 700 M 315 -350 v 700 M 350 -350 v 700
      M -350 -350 h 700 M -350 -315 h 700 M -350 -280 h 700 M -350 -245 h 700 M -350 -210 h 700
      M -350 -175 h 700 M -350 -140 h 700 M -350 -105 h 700 M -350 -70 h 700 M -350 -35 h 700
      M -350 0 h 700 M -350 35 h 700 M -350 70 h 700 M -350 105 h 700 M -350 140 h 700
      M -350 175 h 700 M -350 210 h 700 M -350 245 h 700 M -350 280 h 700 M -350 315 h 700 M -350 350 h 700
    "/>

    <line class="axis" x1="0" y1="0" x2="370" y2="0" marker-end="url(#arrow)"/>
    <line class="axis" x1="0" y1="0" x2="-370" y2="0" marker-end="url(#arrow)"/>
    <line class="axis" x1="0" y1="0" x2="0" y2="-370" marker-end="url(#arrow)"/>
    <line class="axis" x1="0" y1="0" x2="0" y2="370" marker-end="url(#arrow)"/>

    <path class="tick" d="
      M -350 -4 v 8 M -315 -4 v 8 M -280 -4 v 8 M -245 -4 v 8 M -210 -4 v 8
      M -175 -4 v 8 M -140 -4 v 8 M -105 -4 v 8 M -70 -4 v 8 M -35 -4 v 8
      M 35 -4 v 8 M 70 -4 v 8 M 105 -4 v 8 M 140 -4 v 8 M 175 -4 v 8
      M 210 -4 v 8 M 245 -4 v 8 M 280 -4 v 8 M 315 -4 v 8 M 350 -4 v 8
      M -4 -350 h 8 M -4 -315 h 8 M -4 -280 h 8 M -4 -245 h 8 M -4 -210 h 8
      M -4 -175 h 8 M -4 -140 h 8 M -4 -105 h 8 M -4 -70 h 8 M -4 -35 h 8
      M -4 35 h 8 M -4 70 h 8 M -4 105 h 8 M -4 140 h 8 M -4 175 h 8
      M -4 210 h 8 M -4 245 h 8 M -4 280 h 8 M -4 315 h 8 M -4 350 h 8
    "/>

    <g class="label label-x" transform="translate(0, 20)">
      <text x="-350">-10</text> <text x="-315">-9</text>  <text x="-280">-8</text>
      <text x="-245">-7</text>  <text x="-210">-6</text>  <text x="-175">-5</text>
      <text x="-140">-4</text>  <text x="-105">-3</text>  <text x="-70">-2</text>
      <text x="-35">-1</text>   <text x="35">1</text>    <text x="70">2</text>
      <text x="105">3</text>    <text x="140">4</text>    <text x="175">5</text>
      <text x="210">6</text>    <text x="245">7</text>    <text x="280">8</text>
      <text x="315">9</text>    <text x="350">10</text>
    </g>

    <g class="label label-y" transform="translate(-10, 0)">
      <text y="-350">10</text>  <text y="-315">9</text>   <text y="-280">8</text>
      <text y="-245">7</text>   <text y="-210">6</text>   <text y="-175">5</text>
      <text y="-140">4</text>   <text y="-105">3</text>   <text y="-70">2</text>
      <text y="-35">1</text>    <text y="35">-1</text>   <text y="70">-2</text>
      <text y="105">-3</text>   <text y="140">-4</text>   <text y="175">-5</text>
      <text y="210">-6</text>   <text y="245">-7</text>   <text y="280">-8</text>
      <text y="315">-9</text>   <text y="350">-10</text>
    </g>

    <text class="label label-y" x="-10" y="16">0</text>

    <text class="axis-label" x="380" y="-12">x</text>
    <text class="axis-label" x="16" y="-375">y</text>

    <circle class="plot-geometry" cx="0" cy="-70" r="105"/>
    
    <circle class="plot-dot" cx="0" cy="-70" r="4"/>
    <circle class="plot-dot" cx="0" cy="-175" r="4"/>
    <circle class="plot-dot" cx="0" cy="35" r="4"/>

    <text class="plot-text" x="12" y="-65">O</text>
    <text class="plot-text" x="112" y="-75">C</text>
  </g>
</svg>
