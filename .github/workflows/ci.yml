name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  id-token: write
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter @ticomatica/web lint

      - name: Type Check
        run: pnpm --filter @ticomatica/web typecheck

      - name: Run Tests
        run: pnpm --filter @ticomatica/web test

      - name: Build static site
        run: pnpm --filter @ticomatica/web build

      - name: Upload website build
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: apps/web/out
          if-no-files-found: error

  infra:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download website build
        uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: apps/web/out

      - name: Type Check
        run: pnpm --filter @ticomatica/infra typecheck

      - name: Synthesize dev stack
        run: pnpm --filter @ticomatica/infra synth:dev

      - name: Synthesize prod stack
        run: pnpm --filter @ticomatica/infra synth:prod

  deploy-dev:
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: infra
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download website build
        uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: apps/web/out

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy dev
        run: pnpm --filter @ticomatica/infra deploy:dev

  deploy-prod:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: infra
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download website build
        uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: apps/web/out

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy prod
        run: pnpm --filter @ticomatica/infra deploy:prod
