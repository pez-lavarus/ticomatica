name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:
    inputs:
      stage:
        description: Deployment stage
        required: true
        type: choice
        options: [dev, prod]

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    name: CI
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Synthesize dev stack
        run: pnpm infra:synth:dev

      - name: Synthesize prod stack
        run: pnpm infra:synth:prod

  deploy:
    name: Deploy (${{ inputs.stage }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.stage == 'prod' && secrets.AWS_PROD_ROLE_ARN || secrets.AWS_DEV_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy infrastructure
        run: pnpm --filter @ticomatica/infrastructure deploy:${{ inputs.stage }}

      - name: Capture stack outputs
        run: |
          STACK_SUFFIX=${{ inputs.stage == 'prod' && 'Prod' || 'Dev' }}
          FUNCTION_NAME=$(aws cloudformation describe-stacks --stack-name "Telemetry${STACK_SUFFIX}" --query "Stacks[0].Outputs[?OutputKey=='AnalysisFunctionName'].OutputValue" --output text)
          BUCKET=$(aws cloudformation describe-stacks --stack-name "WebHosting${STACK_SUFFIX}" --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue" --output text)
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name "WebHosting${STACK_SUFFIX}" --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          echo "FUNCTION_NAME=${FUNCTION_NAME}" >> "$GITHUB_ENV"
          echo "BUCKET=${BUCKET}" >> "$GITHUB_ENV"
          echo "DISTRIBUTION_ID=${DISTRIBUTION_ID}" >> "$GITHUB_ENV"

      - name: Package function code
        run: pnpm --filter @ticomatica/infrastructure package

      - name: Deploy function code
        run: |
          if [ "${{ inputs.stage }}" = "prod" ]; then
            VERSION=$(aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://apps/infrastructure/dist/lambda.zip --publish --query Version --output text)
            aws lambda update-alias --function-name "$FUNCTION_NAME" --name live --function-version "$VERSION" 2>/dev/null || aws lambda create-alias --function-name "$FUNCTION_NAME" --name live --function-version "$VERSION"
          else
            aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://apps/infrastructure/dist/lambda.zip
          fi

      - name: Build frontend
        run: pnpm --filter @ticomatica/web build

      - name: Upload frontend (HTML)
        run: aws s3 sync apps/web/out "s3://$BUCKET" --exclude "*" --include "*.html" --cache-control "public,max-age=0,must-revalidate"

      - name: Upload frontend (hashed assets)
        run: aws s3 sync apps/web/out "s3://$BUCKET" --exclude "*.html" --exclude "*.json" --cache-control "public,max-age=31536000,immutable"

      - name: Upload frontend (data files)
        run: aws s3 sync apps/web/out "s3://$BUCKET" --exclude "*" --include "*.json" --cache-control "public,max-age=3600"

      - name: Remove stale files
        run: aws s3 sync apps/web/out "s3://$BUCKET" --delete

      - name: Invalidate CDN
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
